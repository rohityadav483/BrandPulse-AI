[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brandpulse-backend"
dynamic = ["version"]
description = "BrandPulse AI backend (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2>=2.0",
    "ruff>=0.6",
]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not model and not live'"
markers = [
    "model: loads the real NLP model (excluded from default runs)",
    "live: makes live SerpApi/Groq calls (excluded from default runs)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# backend/alembic/ (migrations) would otherwise make ruff treat the alembic package as local.
known-third-party = ["alembic"]
